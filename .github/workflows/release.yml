# Builds Plural for every platform when a GitHub release is published, generates store listings and images
# from Marketing/, submits stable Android releases to Google Play using Workload Identity Federation and uploads
# stable macOS/iOS builds to App Store Connect. Steps whose secrets are not set are skipped.
# Secrets and variables: see Marketing/README.md ("Release workflow").
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (manual runs keep the files as run artifacts only)"
        required: true
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.301"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CELT_URL: https://downloads.xiph.org/releases/celt/celt-0.7.1.tar.gz
  CELT_SHA256: 93f0e2dfb59021b19e69dc0dee855eb89f19397db1dea0d0d6f9329cff933066
  LAME_URL: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
  LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: 27d33157cc252c29ad6f777a96a0d94176fea1b534ff09b5071485def143b90e
  INTER_URL: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
  INTER_SHA256: 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  plan:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      msix: ${{ steps.v.outputs.msix }}
      has_ios: ${{ steps.v.outputs.has_ios }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          RAW: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          v="${RAW#v}"; v="${v%%-*}"; v="${v%%+*}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RAW' is not a version like v1.2.3"; exit 1
          fi
          IFS=. read -r major minor patch <<< "$v"
          # Android versionCode / Apple build number: increases with every version (1.2.3 -> 1020300).
          build=$(( major * 1000000 + minor * 10000 + patch * 100 ))
          has_ios=false; [ -f Src/Plural.App.iOS/Plural.App.iOS.csproj ] && has_ios=true
          {
            echo "version=$v"; echo "build=$build"; echo "msix=$v.0"; echo "has_ios=$has_ios"
          } >> "$GITHUB_OUTPUT"
          echo "Version $v, build $build, iOS head: $has_ios" >> "$GITHUB_STEP_SUMMARY"

  screenshots:
    name: Screenshots (simulated mics)
    needs: [plan, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: native-celt
          path: Native/celt/runtimes
      - name: Render
        run: dotnet run --project Src/Plural.Screenshots -c Release -- --out out/screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: out/screenshots
          if-no-files-found: error

  store-assets:
    name: Store listings and images
    needs: [plan, screenshots]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Use rendered screenshots where none are committed
        run: |
          for dir in "$RUNNER_TEMP"/screenshots/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"; dest="Marketing/screenshots/$name"
            if ls "$dest"/*.png "$dest"/*.jpg "$dest"/*.jpeg > /dev/null 2>&1; then
              echo "$name: using the committed screenshots"
            else
              mkdir -p "$dest" && cp "$dir"*.png "$dest/" && echo "$name: using rendered screenshots"
            fi
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pillow==11.3.0"
      - name: Store tooling tests
        run: python -m unittest discover -s Tools/store -p test_store_assets.py -v
      - name: Inter font
        run: |
          curl -fsSL -o inter.zip "$INTER_URL"
          echo "$INTER_SHA256  inter.zip" | sha256sum -c -
          unzip -q inter.zip "extras/ttf/Inter-Bold.ttf" "extras/ttf/Inter-SemiBold.ttf" -d "$RUNNER_TEMP/inter"
      - name: Build listings
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.txt"
          python Tools/store/store_assets.py build \
            --version "${{ needs.plan.outputs.version }}" --build-number "${{ needs.plan.outputs.build }}" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt" --font-dir "$RUNNER_TEMP/inter" --out out/store
      - name: Summary
        if: always()
        run: '[ -f out/store/REPORT.md ] && cat out/store/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        with:
          name: store-assets
          path: out/store
          if-no-files-found: error

  native:
    name: Native libraries (Windows, Android)
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Sources and toolchains
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          curl -fsSL -o celt.tar.gz "$CELT_URL"
          echo "$CELT_SHA256  celt.tar.gz" | sha256sum -c -
          tar -xzf celt.tar.gz -C "$RUNNER_TEMP/src"
          curl -fsSL -o llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
      - name: CELT
        env:
          CELT_SRC: ${{ runner.temp }}/src/celt-0.7.1
          LLVM_MINGW: ${{ runner.temp }}/llvm-mingw
        run: |
          bash Native/celt/build-windows.sh
      - name: Android native libraries
        env:
          CELT_SRC: ${{ runner.temp }}/src/celt-0.7.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          ANDROID_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" bash Native/celt/build-android.sh
          curl -fsSL -o lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA256  lame.tar.gz" | sha256sum -c -
          tar -xzf lame.tar.gz -C "$RUNNER_TEMP/src"
          LAME_SRC="$RUNNER_TEMP/src/lame-3.100" ANDROID_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" bash Native/lame/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: native-celt
          path: Native/celt/runtimes
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-lame-android
          path: Native/lame/runtimes
          if-no-files-found: error

  windows:
    name: Windows (x64, arm64, MSIX)
    needs: [plan, native, store-assets]
    if: ${{ !cancelled() && needs.native.result == 'success' && needs.store-assets.result == 'success' }}
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MSIX_VERSION: ${{ needs.plan.outputs.msix }}
      HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: native-celt
          path: Native/celt/runtimes
      - uses: actions/download-artifact@v8
        with:
          name: store-assets
          path: out/store
      - name: Tests
        run: dotnet test Src/Plural.Core.Tests -c Release
      - name: Publish
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish Src/Plural.App.Desktop -c Release -r "win-$arch" --self-contained `
              -p:Version=$env:VERSION -o "out/publish/win-$arch"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Get-ChildItem "out/publish/win-$arch/runtimes" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne "win-$arch" } | Remove-Item -Recurse -Force
            New-Item -ItemType Directory -Force out/dist | Out-Null
            Compress-Archive -Path "out/publish/win-$arch/*" -DestinationPath "out/dist/Plural-$env:VERSION-windows-$arch.zip"
          }
      - name: MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $toml = Get-Content Marketing/store.toml -Raw
          function From-Toml($key) { if ($toml -match "(?m)^$key\s*=\s*""([^""]*)""") { $Matches[1] } }
          $identity = if ($env:IDENTITY_NAME) { $env:IDENTITY_NAME } else { From-Toml 'identity_name' }
          $publisher = if ($env:PUBLISHER) { $env:PUBLISHER } else { From-Toml 'publisher' }
          $pubName = if ($env:PUBLISHER_DISPLAY_NAME) { $env:PUBLISHER_DISPLAY_NAME } else { From-Toml 'publisher_display_name' }
          $description = (Get-Content Marketing/en-US/short_description.txt -Raw).Trim()
          foreach ($arch in 'x64', 'arm64') {
            ./Packaging/windows/build-msix.ps1 -PublishDir "out/publish/win-$arch" -Arch $arch -Version $env:MSIX_VERSION `
              -AssetsDir out/store/msix-assets -OutFile "out/msix/Plural_$($env:MSIX_VERSION)_$arch.msix" `
              -IdentityName $identity -Publisher $publisher -PublisherDisplayName $pubName -Description $description
          }
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeappx = Get-ChildItem $kits -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName bundle /d out/msix /p "out/dist/Plural-$env:VERSION.msixbundle" /bv $env:MSIX_VERSION /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign MSIX bundle (sideloading)
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD `
            "out/dist/Plural-$env:VERSION.msixbundle"
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/dist
          if-no-files-found: error

  microsoft-store:
    name: Microsoft Store submission
    needs: [plan, windows, store-assets]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: microsoft-store-publishing
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: in/windows
      - uses: actions/download-artifact@v8
        with:
          name: store-assets
          path: in/store-assets
      - name: Prepare submission
        run: >
          python Tools/store/microsoft_store.py --assets in/store-assets/windows
          --package "in/windows/Plural-$VERSION.msixbundle" --version "$VERSION" --prepare-only
      - name: Submit to Microsoft Store
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
          MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: >
          python Tools/store/microsoft_store.py --assets in/store-assets/windows
          --package "in/windows/Plural-$VERSION.msixbundle" --version "$VERSION"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: microsoft-submission
          path: out/microsoft-submission
          if-no-files-found: warn

  android:
    name: Android (APK, AAB)
    needs: [plan, native]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet workload install android
      - uses: actions/download-artifact@v8
        with:
          name: native-celt
          path: Native/celt/runtimes
      - uses: actions/download-artifact@v8
        with:
          name: native-lame-android
          path: Native/lame/runtimes
      - name: Android SDK packages
        run: >
          dotnet build Src/Plural.App.Android -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required for Android releases"; exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Publish
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::$name is required"; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/store-password.txt"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/key-password.txt"
          signing=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
                   -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                   -p:AndroidSigningStorePass="file:$RUNNER_TEMP/store-password.txt"
                   -p:AndroidSigningKeyPass="file:$RUNNER_TEMP/key-password.txt")
          dotnet publish Src/Plural.App.Android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidPackageFormats=apk%3Baab -p:ApplicationVersion="$BUILD" \
            -p:ApplicationDisplayVersion="$VERSION" -p:Version="$VERSION" "${signing[@]}"
          pub=Src/Plural.App.Android/bin/Release/net10.0-android/publish
          mkdir -p out/dist
          cp "$pub/../net.getplural.app-Signed.apk" "out/dist/Plural-$VERSION-android.apk"
          cp "$pub/net.getplural.app-Signed.aab" "out/dist/Plural-$VERSION-android.aab"
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/store-password.txt" "$RUNNER_TEMP/key-password.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/dist
          if-no-files-found: error

  google-play:
    name: Google Play submission
    needs: [plan, android, store-assets]
    if: ${{ !cancelled() && github.event_name == 'release' && !github.event.release.prerelease && needs.android.result == 'success' && needs.store-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: google-play-publishing
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      TRACK: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
      STATUS: ${{ vars.GOOGLE_PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "google-api-python-client==2.192.0" "google-auth==2.49.1"
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: in/android
      - uses: actions/download-artifact@v8
        with:
          name: store-assets
          path: in/store-assets
      - name: Check federation settings
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_PLAY_SERVICE_ACCOUNT variables are required"; exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
      - name: Submit to Google Play
        run: >
          python Tools/store/google_play.py --assets in/store-assets/android
          --package "in/android/Plural-$VERSION-android.aab" --build-number "$BUILD"
          --version "$VERSION" --track "$TRACK" --status "$STATUS"

  macos:
    name: macOS (arm64, x64)
    needs: [plan, store-assets]
    if: ${{ !cancelled() && needs.store-assets.result == 'success' }}
    runs-on: macos-15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      # Each signing path runs only when all of its secrets are set; otherwise it is skipped.
      HAS_DEVID: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      HAS_MAS: >-
        ${{ secrets.MAS_CERT_P12_BASE64 != '' && secrets.MAS_CERT_PASSWORD != '' && secrets.MAS_APP_IDENTITY != ''
        && secrets.MAS_INSTALLER_IDENTITY != '' && secrets.MAS_PROVISIONING_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: store-assets
          path: out/store
      - name: Native libraries
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          curl -fsSL -o celt.tar.gz "$CELT_URL"
          echo "$CELT_SHA256  celt.tar.gz" | shasum -a 256 -c -
          curl -fsSL -o lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA256  lame.tar.gz" | shasum -a 256 -c -
          tar -xzf celt.tar.gz -C "$RUNNER_TEMP/src"
          tar -xzf lame.tar.gz -C "$RUNNER_TEMP/src"
          CELT_SRC="$RUNNER_TEMP/src/celt-0.7.1" bash Native/celt/build-macos.sh
          LAME_SRC="$RUNNER_TEMP/src/lame-3.100" bash Native/lame/build-macos.sh
      - name: Publish and bundle
        run: |
          mkdir -p out/dist
          for rid in osx-arm64 osx-x64; do
            dotnet publish Src/Plural.App.Desktop -c Release -r "$rid" --self-contained \
              -p:Version="$VERSION" -p:UseAppHost=true -o "out/publish/$rid"
            bash Packaging/macos/build-app.sh "out/publish/$rid" "$rid" "$VERSION" "$BUILD" \
              out/store/macos.iconset "out/app/$rid"
          done
      - name: Keychain
        if: env.HAS_DEVID == 'true' || env.HAS_MAS == 'true'
        env:
          DEVID_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          DEVID_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MAS_P12: ${{ secrets.MAS_CERT_P12_BASE64 }}
          MAS_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kp="$(uuidgen)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          for pair in DEVID_P12:DEVID_PASSWORD:HAS_DEVID MAS_P12:MAS_PASSWORD:HAS_MAS; do
            IFS=: read -r data_var pass_var flag_var <<< "$pair"
            [ "${!flag_var}" = "true" ] || continue
            echo "${!data_var}" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "${!pass_var}" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$kc"
      - name: Developer ID signing and notarization
        if: env.HAS_DEVID == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for rid in osx-arm64 osx-x64; do
            app="out/app/$rid/Plural.app"
            # Inside-out: every Mach-O file, then the bundle.
            find "$app/Contents/MacOS" -type f | while read -r f; do
              if file "$f" | grep -q Mach-O; then
                codesign --force --timestamp --options runtime --keychain "$RUNNER_TEMP/signing.keychain-db" --entitlements Packaging/macos/Entitlements.plist -s "$IDENTITY" "$f"
              fi
            done
            codesign --force --timestamp --options runtime --keychain "$RUNNER_TEMP/signing.keychain-db" --entitlements Packaging/macos/Entitlements.plist -s "$IDENTITY" "$app"
            codesign --verify --strict --deep "$app"
            if [ "$HAS_NOTARY" = "true" ]; then
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "$app"
            fi
          done
      - name: Zip and disk images
        run: |
          for rid in osx-arm64 osx-x64; do
            arch="${rid#osx-}"
            ditto -c -k --keepParent "out/app/$rid/Plural.app" "out/dist/Plural-$VERSION-macos-$arch.zip"
            hdiutil create -volname Plural -srcfolder "out/app/$rid/Plural.app" -ov -format UDZO \
              "out/dist/Plural-$VERSION-macos-$arch.dmg"
          done
          [ "$HAS_DEVID" = "true" ] || echo "::warning::Developer ID secrets not set: the macOS apps are unsigned (Gatekeeper will block them)."
          [ "$HAS_MAS" = "true" ] || echo "::notice::Mac App Store secrets not set: no App Store .pkg is built."
      - name: Mac App Store package
        if: env.HAS_MAS == 'true'
        env:
          APP_IDENTITY: ${{ secrets.MAS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_IDENTITY }}
          PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The Mac App Store build is Apple silicon only (a .NET app can't be one universal bundle without lipo-ing the runtime).
          app="out/mas/Plural.app"
          rm -rf out/mas; mkdir -p out/mas
          bash Packaging/macos/build-app.sh out/publish/osx-arm64 osx-arm64 "$VERSION" "$BUILD" out/store/macos.iconset out/mas
          echo "$PROFILE_BASE64" | base64 -d > "$app/Contents/embedded.provisionprofile"
          ent="$RUNNER_TEMP/mas.entitlements"
          cp Packaging/macos/Entitlements.appstore.plist "$ent"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $APPLE_TEAM_ID.net.getplural.app" "$ent"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $APPLE_TEAM_ID" "$ent"
          find "$app/Contents/MacOS" -type f ! -name Plural | while read -r f; do
            if file "$f" | grep -q Mach-O; then
              codesign --force --timestamp --keychain "$RUNNER_TEMP/signing.keychain-db" --entitlements Packaging/macos/Entitlements.inherit.plist -s "$APP_IDENTITY" "$f"
            fi
          done
          codesign --force --timestamp --keychain "$RUNNER_TEMP/signing.keychain-db" --entitlements "$ent" -s "$APP_IDENTITY" "$app"
          productbuild --component "$app" /Applications --keychain "$RUNNER_TEMP/signing.keychain-db" --sign "$INSTALLER_IDENTITY" "out/dist/Plural-$VERSION-macos-appstore.pkg"
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/dist
          if-no-files-found: error

  ios:
    name: iOS
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.has_ios == 'true' }}
    # The .NET iOS workload tracks the newest Xcode (27.x), which only the xcode-27 image has.
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      HAS_IOS_CERT: >-
        ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_CERT_PASSWORD != '' && secrets.IOS_SIGN_IDENTITY != ''
        && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet workload install ios
      - name: Select Xcode
        run: |
          # The workload requires the Xcode matching its iOS SDK pack (Microsoft.iOS.Sdk.net10.0_<xcode>).
          xc=$(ls -d "${DOTNET_ROOT:-$HOME/.dotnet}"/packs/Microsoft.iOS.Sdk.net10.0_* | sed 's/.*_//' | sort -V | tail -n 1)
          for app in "/Applications/Xcode_$xc.app" "/Applications/Xcode_$xc.0.app" "/Applications/Xcode_${xc%.0}.app"; do
            if [ -d "$app" ]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version
      - name: Native libraries
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          curl -fsSL -o celt.tar.gz "$CELT_URL"
          echo "$CELT_SHA256  celt.tar.gz" | shasum -a 256 -c -
          curl -fsSL -o lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA256  lame.tar.gz" | shasum -a 256 -c -
          tar -xzf celt.tar.gz -C "$RUNNER_TEMP/src"
          tar -xzf lame.tar.gz -C "$RUNNER_TEMP/src"
          CELT_SRC="$RUNNER_TEMP/src/celt-0.7.1" bash Native/celt/build-ios.sh
          LAME_SRC="$RUNNER_TEMP/src/lame-3.100" bash Native/lame/build-ios.sh
      - name: Signing
        if: env.HAS_IOS_CERT == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/ios.keychain-db"; kp="$(uuidgen)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Xcode 16+ reads profiles from UserData; older tooling from MobileDevice.
          for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$dir"
            echo "$PROFILE_BASE64" | base64 -d > "$dir/plural.mobileprovision"
          done
      - name: Publish
        env:
          IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: |
          mkdir -p out/dist
          if [ "$HAS_IOS_CERT" = "true" ]; then
            dotnet publish Src/Plural.App.iOS -c Release -f net10.0-ios -r ios-arm64 \
              -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$BUILD" -p:Version="$VERSION" \
              -p:ArchiveOnBuild=true -p:CodesignKey="$IDENTITY"
            ipa="$(find Src/Plural.App.iOS/bin/Release -name '*.ipa' | head -n 1)"
            cp "$ipa" "out/dist/Plural-$VERSION-ios.ipa"
          else
            echo "::warning::iOS signing secrets not set: iOS is compiled for the simulator but no .ipa is produced (Apple requires signing)."
            dotnet build Src/Plural.App.iOS -c Release -f net10.0-ios -r iossimulator-arm64 -p:Version="$VERSION"
            echo "unsigned build only" > out/dist/ios-unsigned.txt
          fi
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ios.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/dist

  app-store:
    name: App Store Connect upload (macOS, iOS)
    needs: [plan, store-assets, macos, ios]
    # Stable releases only (build numbers can't be reused); the whole job is skipped until the API key IDs are set.
    if: >-
      ${{ !cancelled() && github.event_name == 'release' && !github.event.release.prerelease
      && needs.plan.result == 'success' && vars.APP_STORE_CONNECT_KEY_ID != '' && vars.APP_STORE_CONNECT_ISSUER_ID != '' }}
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: app-store-publishing
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      HAS_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
      UPLOAD_LISTING: ${{ vars.APP_STORE_UPLOAD_LISTING == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check API key
        run: |
          [ "$HAS_KEY" = "true" ] || echo "::warning::APP_STORE_CONNECT_API_KEY secret not set: nothing is uploaded to App Store Connect."
      - uses: actions/download-artifact@v8
        if: env.HAS_KEY == 'true' && needs.macos.result == 'success'
        with:
          name: macos
          path: in/macos
      - uses: actions/download-artifact@v8
        if: env.HAS_KEY == 'true' && needs.ios.result == 'success'
        with:
          name: ios
          path: in/ios
      - uses: actions/download-artifact@v8
        if: env.HAS_KEY == 'true' && env.UPLOAD_LISTING == 'true'
        with:
          name: store-assets
          path: in/store-assets
      - name: Install API key
        if: env.HAS_KEY == 'true'
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # altool looks for AuthKey_<id>.p8 here. The secret may be the .p8 text or its base64.
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          p8=~/.appstoreconnect/private_keys/"AuthKey_$KEY_ID.p8"
          if printf '%s' "$API_KEY" | grep -q -- '-----BEGIN'; then printf '%s\n' "$API_KEY" > "$p8"
          else printf '%s' "$API_KEY" | base64 -d > "$p8"; fi
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$p8" || { echo "::error::APP_STORE_CONNECT_API_KEY is not a .p8 private key"; exit 1; }
          jq -n --arg k "$KEY_ID" --arg i "$ISSUER_ID" --rawfile p "$p8" \
            '{key_id: $k, issuer_id: $i, key: $p, in_house: false}' > "$RUNNER_TEMP/asc-api-key.json"
      - name: Upload to App Store Connect
        id: upload
        if: env.HAS_KEY == 'true'
        run: |
          upload() {  # upload <type> <file>
            if [ ! -f "$2" ]; then
              echo "::notice::$1: no $(basename "$2") was built (signing secrets not set), skipping"; return
            fi
            echo "Uploading $2"
            xcrun altool --upload-app --type "$1" --file "$2" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
            echo "$1=true" >> "$GITHUB_OUTPUT"
            echo "- $1: uploaded $(basename "$2") (version $VERSION, build $BUILD)" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "## App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          upload macos "in/macos/Plural-$VERSION-macos-appstore.pkg"
          upload ios "in/ios/Plural-$VERSION-ios.ipa"
      - name: Upload App Store listing
        if: env.HAS_KEY == 'true' && env.UPLOAD_LISTING == 'true' && (steps.upload.outputs.macos == 'true' || steps.upload.outputs.ios == 'true')
        env:
          IOS: ${{ steps.upload.outputs.ios }}
          MACOS: ${{ steps.upload.outputs.macos }}
        run: |
          command -v fastlane > /dev/null || brew install fastlane
          deliver() {  # deliver <fastlane platform> <store-assets folder>
            fastlane deliver --api_key_path "$RUNNER_TEMP/asc-api-key.json" --app_identifier net.getplural.app \
              --platform "$1" --app_version "$VERSION" \
              --metadata_path "in/store-assets/$2/metadata" --screenshots_path "in/store-assets/$2/screenshots" \
              --skip_binary_upload true --overwrite_screenshots true --submit_for_review false \
              --run_precheck_before_submit false --force true
          }
          [ "$IOS" = "true" ] && deliver ios ios
          [ "$MACOS" = "true" ] && deliver osx macos
          true
      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/asc-api-key.json"

  publish:
    name: Store packages and release upload
    needs: [plan, store-assets, android]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.store-assets.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{android,store-assets}"
          path: in
      - name: Assemble store packages
        run: |
          mkdir -p dist
          s=in/store-assets
          pack() {  # pack <store> <listing dir> <binary files...>: listing + binaries in one zip
            local store="$1" listing="$2"; shift 2
            local dir="pkg/Plural-$VERSION-$store-store"
            mkdir -p "$dir"
            cp -R "$listing/." "$dir/listing/"
            cp "$s/REPORT.md" "$dir/"
            for f in "$@"; do [ -f "$f" ] && mkdir -p "$dir/binaries" && cp "$f" "$dir/binaries/"; done
            (cd pkg && zip -qr "../dist/Plural-$VERSION-$store-store.zip" "$(basename "$dir")")
          }
          pack google-play "$s/android" in/android/*.aab
          # Apps for direct download.
          for f in in/android/*; do
            [ -f "$f" ] && cp "$f" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: Summary
        run: |
          {
            echo "## Release files"; echo
            for f in dist/*; do echo "- $(basename "$f") ($(du -h "$f" | cut -f1))"; done
            echo
            echo "Android build: ${{ needs.android.result }}. Windows uploads are temporarily disabled."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION }}
          path: dist
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
